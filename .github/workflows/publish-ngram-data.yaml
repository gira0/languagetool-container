name: Publish LanguageTool n-gram data

"on":
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ARTIFACT: ghcr.io/${{ github.repository }}/languagetool-ngrams
  DOWNLOAD_URL: https://languagetool.org/download/ngram-data

jobs:
  publish:
    name: Download and publish n-gram data
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install --yes jq unzip

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Check and download n-gram archives
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/source work/data
          curl -fsSL "$DOWNLOAD_URL/" \
            | grep -Eo 'href="[^"]+\.zip"' \
            | cut -d'"' -f2 \
            | sort -u > work/archives.txt
          test -s work/archives.txt
          while IFS= read -r archive; do
            headers=$(curl -fsSLI --retry 3 --retry-all-errors "$DOWNLOAD_URL/$archive" | tr -d '\r')
            etag=$(printf '%s\n' "$headers" | awk 'tolower($1) == "etag:" { value=$2 } END { print value }')
            last_modified=$(printf '%s\n' "$headers" | awk 'tolower($1) == "last-modified:" { $1=""; sub(/^ /, ""); value=$0 } END { print value }')
            size=$(printf '%s\n' "$headers" | awk 'tolower($1) == "content-length:" { value=$2 } END { print value }')
            test -n "$etag" && test -n "$last_modified" && test -n "$size"
            printf '%s\t%s\t%s\t%s\n' "$archive" "$etag" "$last_modified" "$size"
          done < work/archives.txt > work/remote-metadata.tsv
          jq -Rn '[inputs | split("\t") | {name: .[0], etag: .[1], last_modified: .[2], size: (.[3] | tonumber)}]' \
            < work/remote-metadata.tsv > work/remote-manifest.json
          remote_metadata_sha256=$(sha256sum work/remote-manifest.json | cut -d' ' -f1)
          if oras manifest fetch "$ARTIFACT:latest" > work/previous-manifest.json 2>/dev/null \
            && test "$(jq -r '.annotations["org.languagetool.ngrams.remote-metadata-sha256"] // empty' work/previous-manifest.json)" = "$remote_metadata_sha256"; then
            echo 'n-gram data is unchanged; publication skipped.'
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            while IFS= read -r archive; do
              curl -fL --retry 3 --retry-all-errors \
                "$DOWNLOAD_URL/$archive" -o "work/source/$archive"
              paths=$(unzip -Z1 "work/source/$archive")
              while IFS= read -r path; do
                case "$path" in
                  /*|..|../*|*/../*)
                    echo "Unsafe ZIP path: $path" >&2
                    exit 1
                    ;;
                esac
              done <<< "$paths"
              unzip -q "work/source/$archive" -d work/data
            done < work/archives.txt
            find work/data -type f -print -quit | grep -q .
          fi

      - name: Create content manifest
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (
            cd work/source
            sha256sum -- *
          ) > work/archives.sha256
          jq -n \
            --rawfile archives work/archives.sha256 \
            --slurpfile remote work/remote-manifest.json \
            '{source: "https://languagetool.org/download/ngram-data/", remote: $remote[0], archives: ($archives | split("\n") | map(select(length > 0)))}' \
            > work/manifest.json
          tar -C work/data -czf work/ngram-data.tar.gz .
          sha256sum work/ngram-data.tar.gz | cut -d' ' -f1 > work/content-sha256

      - name: Publish OCI artifact
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          remote_metadata_sha256=$(sha256sum work/remote-manifest.json | cut -d' ' -f1)
          oras push "$ARTIFACT:sha256-$(cat work/content-sha256)" \
            --artifact-type application/vnd.languagetool.ngrams.v1 \
            --annotation "org.languagetool.ngrams.remote-metadata-sha256=$remote_metadata_sha256" \
            work/ngram-data.tar.gz:application/vnd.languagetool.ngrams.archive.v1+gzip \
            work/manifest.json:application/vnd.languagetool.ngrams.manifest.v1+json
          oras tag "$ARTIFACT:sha256-$(cat work/content-sha256)" latest

      - name: Report unchanged data
        if: steps.changes.outputs.changed == 'false'
        run: echo 'n-gram data is unchanged; no publication was needed.'
